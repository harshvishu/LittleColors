Name: Little Colors
Summary: Offline coloring, letter tracing, and counting for toddlers
Description: |-
  Choose from 100 coloring pictures, trace uppercase letters, or count
  groups of objects from 1 to 10. Touch and hold to draw in Assisted mode,
  follow the pencil in Follow Along, or draw and erase in Freehand.

  Little Colors works offline and has no ads or accounts. Parents can
  adjust sound, music, and Android screen pinning.

  Privacy policy: https://harshvishu.github.io/LittleColors/privacy/
