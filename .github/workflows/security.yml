name: Security Scan

on:
  pull_request:
  push:
    branches-ignore:
      - privacy-policy

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret & sensitive-file scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for tracked sensitive files
        run: bash .github/scripts/check-sensitive-files.sh

      - name: Run Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
