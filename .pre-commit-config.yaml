repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: detect-private-key

  - repo: local
    hooks:
      - id: check-sensitive-files
        name: Block forbidden key, keystore, and password files
        entry: .github/scripts/check-sensitive-files.sh
        language: script
        pass_filenames: false
